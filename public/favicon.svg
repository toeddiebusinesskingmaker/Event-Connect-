<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#097266"/>
      <stop offset="100%" stop-color="#05473f"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#25D366"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Base App Icon Container with Rounded Corners (iOS / PC PWA Squircle style) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Subtle decorative inner border line -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#25D366" stroke-opacity="0.3" stroke-width="6"/>

  <!-- Logo Graphics Group -->
  <g filter="url(#glow)">
    <!-- Central Speech Bubble / Location Badge -->
    <path d="M 256 100 C 170 100 100 165 100 245 C 100 295 128 338 172 365 C 165 395 145 418 122 432 C 158 432 200 412 226 388 C 236 390 246 390 256 390 C 342 390 412 325 412 245 C 412 165 342 100 256 100 Z" fill="#ffffff" opacity="0.97" />

    <!-- Connected User Nodes inside the badge -->
    <!-- Left User -->
    <circle cx="210" cy="210" r="28" fill="#075E54" />
    <path d="M 160 290 C 160 252 182 248 210 248 C 238 248 260 252 260 290 Z" fill="#075E54" />

    <!-- Right User -->
    <circle cx="302" cy="210" r="28" fill="#25D366" />
    <path d="M 252 290 C 252 252 274 248 302 248 C 330 248 352 252 352 290 Z" fill="#25D366" />

    <!-- Connection Link Spark / Handshake Bridge -->
    <path d="M 210 210 Q 256 180 302 210" stroke="url(#accentGrad)" stroke-width="8" stroke-linecap="round" fill="none" />
    <circle cx="256" cy="195" r="7" fill="#ffffff" />
  </g>
</svg>
